name: Go Extractor

on: push

jobs:
  test:
    runs-on: windows-latest
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
         go-version: 1.14.2
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test
      run: |
        cd Extractors\Go
        go get github.com/beevik/etree
        go test
